[project]
name = "runstat"
version = "0.1.0"
description = "Reads a completed autonomous-loop run's telemetry off disk and reports what happened."
requires-python = ">=3.13"
dependencies = []

[project.scripts]
runstat = "runstat.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runstat"]
